name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Build profile for frontend deployment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        env:
          VITE_DEFAULT_DEMO_MODE: ${{ vars.VITE_DEFAULT_DEMO_MODE || 'monaco' }}
          VITE_WS_RELAY_URL: ${{ vars.VITE_WS_RELAY_URL }}
          VITE_RELAY_API_BASE: ${{ vars.VITE_RELAY_API_BASE }}
          VITE_SESSION_ID: ${{ vars.VITE_SESSION_ID || 'public' }}
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          clean: true
